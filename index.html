<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15201A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shot Logger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<title>Shot Logger</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
:root{
  --ink:#15201A; --paper:#FBFBF6; --line:#D8D6C8; --green:#1E5B38;
  --flag:#B7222F; --faint:#6B7267; --gold:#7A6A1F; --sage:#3E5A48;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper)}
body{max-width:520px;margin:0 auto;font-family:var(--mono);color:var(--ink);
     padding-bottom:calc(64px + env(safe-area-inset-bottom))}
::-webkit-scrollbar{display:none}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
input{font-family:var(--mono)}

.topbar{background:var(--ink);color:var(--paper);padding:calc(10px + env(safe-area-inset-top)) 16px 9px;
  display:flex;justify-content:space-between;align-items:baseline;position:sticky;top:0;z-index:15}
.topbar .brand{font-family:var(--cond);font-weight:700;font-size:21px;letter-spacing:.14em}
.topbar .status{font-size:10.5px;color:#8FA093}

.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--ink);z-index:20;
  padding-bottom:env(safe-area-inset-bottom);max-width:520px;margin:0 auto}
.tabbar button{flex:1;padding:13px 0 12px;background:none;border:none;font-family:var(--cond);
  font-size:17px;letter-spacing:.1em;font-weight:600;color:#5E6A61;border-top:3px solid transparent}
.tabbar button.on{color:var(--paper);border-top-color:var(--flag)}

.sechead{display:flex;justify-content:space-between;align-items:baseline;padding:16px 16px 8px}
.sechead .t{font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:.1em}
.sechead .n{font-size:10.5px;color:var(--faint)}
.label{font-family:var(--cond);font-size:13px;letter-spacing:.18em;color:var(--faint);font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.step{padding:8px 10px 10px;border-radius:8px;border:1.5px solid transparent;margin:0 -10px}
.step.next{border-color:var(--flag);background:#FDF6F0}
.step.next .label{color:var(--flag)}
.step.next .label::before{content:"▶";font-size:9px}
.step.done .label{color:var(--green)}
.step.done .label::after{content:"✓";font-weight:700}

.holestrip{display:flex;overflow-x:auto;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
.holestrip button{min-width:44px;padding:5px 0 4px;border-radius:6px;border:none;background:transparent;
  font-family:var(--mono);color:var(--ink);flex-shrink:0;line-height:1.15}
.holestrip button b{display:block;font-size:15px;font-weight:600}
.holestrip button small{display:block;font-size:9px;color:var(--faint)}
.holestrip button.p3 small{color:var(--green)}
.holestrip button.p5 small{color:var(--gold)}
.holestrip button.played{background:#E7E5D8}
.holestrip button.cur{background:var(--ink)}
.holestrip button.cur b{color:var(--paper);font-weight:700}
.holestrip button.cur small{color:#9DB0A2}

.chip{padding:11px 0;font-size:15px;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:6px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.chip.sugg{border-color:var(--gold);box-shadow:0 0 0 1.5px var(--gold) inset}
.chip.lie{font-family:var(--cond);font-size:17px;font-weight:700;letter-spacing:.05em}
.chip.lie.on{background:var(--sage);border-color:var(--sage)}

.resbtn{padding:15px 0;font-family:var(--cond);font-size:20px;font-weight:700;letter-spacing:.06em;
  background:#fff;border:2px solid var(--line);border-radius:8px}
.resbtn.target{background:var(--green);color:var(--paper);border-color:var(--green)}
.resbtn.warm{background:#FFF7E0;color:#7A6A1F;border-color:#E8DDB5}
.resbtn.rust{background:#FCEFE6;color:#8A3B12;border-color:#EAD3C0}
.resbtn.mish{background:#F2EFE8;color:#5B4632;border-color:#DDD6C6}
.resbtn.pen{background:#FBE9EB;color:var(--flag);border-color:#EFC3C8}

/* hero */
.hero{background:var(--ink);color:var(--paper);padding:10px 16px 12px;display:flex;align-items:center;gap:14px}
.hero .num{font-family:var(--cond);font-weight:700;font-size:52px;line-height:.9}
.hero .num small{display:block;font-size:12px;letter-spacing:.2em;color:#8FA093;font-weight:600}
.hero .mid{flex:1}
.hero .mid .l1{font-family:var(--cond);font-size:17px;font-weight:700;letter-spacing:.08em}
.hero .mid .l2{font-family:var(--mono);font-size:11px;color:#8FA093;margin-top:2px}
.hero .gd{text-align:right;font-family:var(--mono);font-size:13px;line-height:1.5}
.hero .gd b{color:#7FD1A0;font-size:16px}
.hero .gd .gk{color:#8FA093;font-size:10px}

/* saved-shot card */
#savedcard{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:40;
  background:var(--green);color:var(--paper);border-radius:12px;padding:14px 16px;
  box-shadow:0 6px 20px rgba(0,0,0,.35);display:flex;align-items:center;gap:12px;max-width:496px;margin:0 auto;
  animation:pop .18s ease-out}
#savedcard.penalty{background:var(--flag)}
#savedcard .big{font-family:var(--cond);font-weight:700;font-size:22px;letter-spacing:.04em;line-height:1.1}
#savedcard .sub{font-family:var(--mono);font-size:11px;color:rgba(251,251,246,.75);margin-top:2px}
#savedcard button{margin-left:auto;background:rgba(0,0,0,.25);border:none;color:#F0B429;
  font-family:var(--cond);font-size:17px;font-weight:700;letter-spacing:.08em;padding:10px 14px;border-radius:8px}
@keyframes pop{from{transform:translateY(8px) scale(.97);opacity:0}to{transform:none;opacity:1}}

/* this-hole trace */
.trace{display:flex;gap:5px;overflow-x:auto;padding:2px 0;-webkit-overflow-scrolling:touch}
.trace span{flex-shrink:0;font-family:var(--mono);font-size:11.5px;padding:5px 9px;border-radius:5px;
  background:#EDEBDD;color:var(--ink);border:1px solid var(--line)}
.trace span.pen{background:#FBE9EB;color:var(--flag)}
.trace span.tgt{background:#E2EFE6;color:var(--green);font-weight:600}
.trace span.pending{background:#FFF3D6;color:#8A6D1A;border-color:#E8D9A8;font-weight:600}

/* quick mode */
.modebar{display:flex;gap:6px;padding:8px 16px 0}
.modebar button{flex:1;padding:9px 0;border-radius:7px;border:1.5px solid var(--line);background:#fff;
  font-family:var(--cond);font-size:16px;font-weight:700;letter-spacing:.08em;color:var(--faint)}
.modebar button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bigclub{padding:20px 0;font-family:var(--mono);font-size:21px;font-weight:600;background:#fff;
  border:2px solid var(--line);border-radius:10px;color:var(--ink)}
.bigclub:active{background:var(--green);color:var(--paper);border-color:var(--green)}

/* hole review cards (quick mode) */
.rev{margin:8px 0 0;border:2px solid var(--line);border-left-width:5px;border-radius:9px;background:#fff;padding:8px 10px}
.rev.pending{border-left-color:#E0B33C}
.rev.done{border-left-color:var(--green)}
.rev .rl1{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rev .rl1 b{font-family:var(--cond);font-size:19px;letter-spacing:.04em}
.rev .ryd{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px}
.rev .ryd button{width:34px;height:30px;border:1.5px solid var(--line);border-radius:6px;background:#fff;font-size:16px;color:var(--ink)}
.rev .ryd .val{min-width:58px;text-align:center;font-weight:700}
.rev .ryd .val small{display:block;font-size:8.5px;font-weight:400;color:var(--faint)}
.minirow{display:grid;gap:4px;margin-top:4px}
.mini{padding:7px 0 5px;border:1.5px solid var(--line);border-radius:6px;background:#fff;text-align:center;line-height:1.1}
.mini b{display:block;font-size:13px}
.mini small{display:block;font-size:8px;color:var(--faint);letter-spacing:.05em}
.mini.on{background:var(--ink);border-color:var(--ink)}
.mini.on b,.mini.on small{color:var(--paper)}
.mini.on.tgt{background:var(--green);border-color:var(--green)}
.mini.on.pen{background:var(--flag);border-color:var(--flag)}

/* backfill sheet */
#fillsheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--paper);max-width:520px;margin:0 auto;
  border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.35);padding:14px 16px calc(18px + env(safe-area-inset-bottom));
  animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
#fillsheet .fhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
#fillsheet .ft{font-family:var(--cond);font-weight:700;font-size:22px;letter-spacing:.05em}
#fillsheet .fx{background:none;border:none;font-size:22px;color:var(--faint);padding:2px 8px}
#fillscrim{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.35)}

.keypad button{padding:9px 0;font-size:19px;font-weight:500;background:#fff;border:1.5px solid var(--line);border-radius:6px}
.keypad button.bk{background:#EEECE0}

.bigbtn{width:100%;padding:17px 0;background:var(--green);color:var(--paper);border:none;border-radius:8px;
  font-family:var(--cond);font-size:23px;font-weight:700;letter-spacing:.1em}
.ghost{background:none;border:none;font-size:12px;color:var(--flag);text-decoration:underline;padding:0}
.ghost.g{color:var(--green)}

.toast{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:12.5px;
  display:flex;gap:14px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:30;white-space:nowrap}
.toast button{background:none;border:none;color:#F0B429;font-size:13px;font-weight:700}

.tr{display:flex;padding:8px 16px;border-top:1px solid var(--line);font-size:13px;align-items:center}
.th{display:flex;padding:0 16px 4px;font-size:10.5px;color:var(--faint)}
.pill{padding:4px 10px;font-size:11.5px;border-radius:5px;background:transparent;color:var(--faint);border:1px solid var(--line)}
.pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pill.on.g{background:var(--sage);border-color:var(--sage)}
.note{padding:8px 16px 0;font-size:11px;color:var(--faint);line-height:1.6}
.gd{color:var(--green)} .bd{color:var(--flag)} .md{color:var(--gold)}
.card{margin:14px 16px 0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.parbtn{padding:8px 0 6px;border:none;border-top:1px solid var(--line);background:#fff;width:100%}
.parbtn small{display:block;font-size:9.5px;color:var(--faint)}
.parbtn b{display:block;font-size:17px}
/* map overlay */
#mapov{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
#mapdiv{flex:1}
#mapov .bar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--ink)}
#mapov .bar button{flex:1;padding:14px 0;border-radius:8px;border:none;font-family:var(--cond);font-size:19px;font-weight:700;letter-spacing:.08em}
#mapov .maparea{position:relative;flex:1;min-height:0}
#mapov #mapdiv{position:absolute;inset:0;height:auto}
#mapov .cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1000;pointer-events:none;
  width:40px;height:40px}
#mapov .cross::before,#mapov .cross::after{content:"";position:absolute;background:#F5C451;
  box-shadow:0 0 3px rgba(0,0,0,.85)}
#mapov .cross::before{left:50%;top:0;bottom:0;width:1.5px;transform:translateX(-.75px)}
#mapov .cross::after{top:50%;left:0;right:0;height:1.5px;transform:translateY(-.75px)}
#mapov .cross i{position:absolute;top:50%;left:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;
  border:1.5px solid #F5C451;border-radius:50%;box-shadow:0 0 3px rgba(0,0,0,.85)}
#mapov .lyrbtn{position:absolute;right:10px;top:calc(58px + env(safe-area-inset-top));z-index:1000;
  background:rgba(8,18,13,.86);color:#EAF2EC;border:1px solid rgba(255,255,255,.18);border-radius:9px;
  font-family:var(--mono);font-size:11px;padding:8px 11px;backdrop-filter:blur(10px)}
#mapov .hint{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:1000;
  background:rgba(21,32,26,.9);color:var(--paper);font-family:var(--mono);font-size:12px;padding:8px 14px;border-radius:8px;white-space:nowrap}
#mapov .chips{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--ink);-webkit-overflow-scrolling:touch}
#mapov .chips button{flex-shrink:0;padding:9px 12px;border-radius:6px;border:1.5px solid #3A4A40;background:transparent;
  color:var(--paper);font-family:var(--mono);font-size:12.5px}
#mapov .chips button.sel{background:#F0B429;border-color:#F0B429;color:var(--ink);font-weight:700}
.pinbadge{background:#F0B429;color:#15201A;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;border:2px solid #15201A;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.pinbadge.end{background:#FBFBF6;border-color:#B7222F;color:#B7222F}


/* ============ v16 — dark premium theme ============ */
:root{
  --bg:#0A1410; --bg2:#0F1D17; --card:rgba(255,255,255,.055); --cardln:rgba(255,255,255,.10);
  --tx:#EAF2EC; --tx2:#8FA79A; --lime:#8FE3AF; --gold:#F5C451; --rose:#FF6B7A; --amber:#E9A23B;
}
html,body{background:
  radial-gradient(1100px 620px at 78% -12%, #1B5B39 0%, rgba(27,91,57,0) 62%),
  radial-gradient(900px 520px at -14% 8%, #12513A 0%, rgba(18,81,58,0) 58%),
  linear-gradient(180deg,#0A1410 0%,#0C1712 60%,#0A1410 100%);
  background-attachment:fixed; color:var(--tx);
  padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body{-webkit-font-smoothing:antialiased}

.topbar{background:rgba(8,17,13,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.07);box-shadow:none;color:var(--tx)}
.topbar .brand{background:linear-gradient(92deg,#8FE3AF,#F5C451);-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent;font-size:22px}

/* glass cards */
.step,.rev,.card,.glass{background:var(--card);border:1px solid var(--cardln);border-radius:18px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 10px 30px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.07)}
.step{border-color:var(--cardln)}
.step.next{border-color:rgba(245,196,81,.55);background:rgba(245,196,81,.09);
  box-shadow:0 10px 30px rgba(0,0,0,.34),0 0 0 1px rgba(245,196,81,.25),inset 0 1px 0 rgba(255,255,255,.08)}
.step.next .label{color:var(--gold)} .step.next .label::before{content:"▶";font-size:9px}
.step.done .label{color:var(--lime)} .step.done .label::after{content:"✓"}
.label{color:var(--tx2)}

/* hero */
.hero{margin:12px 12px 0;border-radius:20px;padding:14px 16px;
  background:linear-gradient(135deg,rgba(20,81,45,.92),rgba(9,38,24,.88));
  border:1px solid rgba(143,227,175,.22);
  box-shadow:0 14px 38px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.10)}
.hero .num{font-size:56px;background:linear-gradient(180deg,#fff,#A8D9BC);-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent}
.hero .num small{color:var(--lime);opacity:.8}
.hero .mid .l1{color:#fff} .hero .mid .l2{color:#9EBCAA}
.hero .gd b{color:var(--lime);text-shadow:0 0 18px rgba(143,227,175,.45)}
.hero .gd .gk{color:#7E9C8C}

/* hole strip */
.holestrip{border-bottom:none;padding:12px 12px 6px;gap:6px}
.holestrip button{border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);
  color:var(--tx);min-width:46px;padding:7px 0 6px}
.holestrip button small{color:var(--tx2)}
.holestrip button.p3 small{color:var(--lime)} .holestrip button.p5 small{color:var(--gold)}
.holestrip button.played{background:rgba(143,227,175,.14);border-color:rgba(143,227,175,.28)}
.holestrip button.cur{background:linear-gradient(160deg,#F5C451,#E09B2D);border-color:transparent;
  box-shadow:0 6px 18px rgba(233,162,59,.42)}
.holestrip button.cur b{color:#14210F} .holestrip button.cur small{color:rgba(20,33,15,.72)}

/* controls */
.chip,.resbtn,.mini,.bigclub,.keypad button,.modebar button{
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);color:var(--tx);
  border-radius:12px;transition:transform .08s ease,box-shadow .12s ease,background .12s ease}
.chip:active,.resbtn:active,.mini:active,.bigclub:active,.keypad button:active{transform:scale(.94)}
.keypad button{font-size:20px}
.keypad button.bk{background:rgba(255,255,255,.03);color:var(--tx2)}
.chip.on{background:linear-gradient(160deg,#F5C451,#DE9A2B);color:#14210F;border-color:transparent;
  font-weight:700;box-shadow:0 5px 16px rgba(233,162,59,.36)}
.chip.sugg{border-color:rgba(245,196,81,.75);box-shadow:0 0 0 1px rgba(245,196,81,.45) inset}
.chip.lie.on{background:linear-gradient(160deg,#3E8F63,#2A6B48);color:#fff}
.bigclub{padding:17px 0;font-size:20px;font-weight:600;border-radius:15px;
  background:linear-gradient(165deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
  box-shadow:0 6px 16px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.10)}
.bigclub:active{background:linear-gradient(165deg,#3E8F63,#22593B);border-color:transparent}
.resbtn{font-size:19px;padding:15px 0}
.resbtn.target{background:linear-gradient(160deg,#3FBF7A,#1F8A52);color:#06180E;border-color:transparent;
  box-shadow:0 7px 20px rgba(63,191,122,.32)}
.resbtn.warm{background:rgba(233,162,59,.16);color:#F0BE72;border-color:rgba(233,162,59,.34)}
.resbtn.rust{background:rgba(255,138,92,.14);color:#FFAE8A;border-color:rgba(255,138,92,.30)}
.resbtn.mish{background:rgba(255,255,255,.05);color:#BFCFC5;border-color:rgba(255,255,255,.13)}
.resbtn.pen{background:rgba(255,107,122,.15);color:var(--rose);border-color:rgba(255,107,122,.34)}
.modebar button{color:var(--tx2);font-size:16px}
.modebar button.on{background:linear-gradient(160deg,rgba(143,227,175,.22),rgba(63,191,122,.12));
  color:var(--lime);border-color:rgba(143,227,175,.4)}

/* review cards */
.rev{padding:10px 12px;margin-top:9px;border-left:none;position:relative;overflow:hidden}
.rev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.rev.pending::before{background:linear-gradient(180deg,#F5C451,#D98F22)}
.rev.done::before{background:linear-gradient(180deg,#8FE3AF,#2E9A5F)}
.rev .rl1 b{color:#fff;font-size:20px}
.rev .ryd button{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:var(--tx);border-radius:8px}
.rev .ryd .val{color:var(--lime)} .rev .ryd .val small{color:var(--tx2)}
.mini{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.10)}
.mini small{color:var(--tx2)}
.mini.on{background:linear-gradient(160deg,#F5C451,#DE9A2B);border-color:transparent}
.mini.on b,.mini.on small{color:#14210F}
.mini.on.tgt{background:linear-gradient(160deg,#3FBF7A,#1F8A52)}
.mini.on.tgt b,.mini.on.tgt small{color:#06180E}
.mini.on.pen{background:linear-gradient(160deg,#FF7A88,#D6404F)}
.mini.on.pen b,.mini.on.pen small{color:#2B0A0E}

/* trace */

</style>

<body>
<div class="topbar"><span class="brand">SHOT LOGGER</span><span class="status" id="topstatus">IDLE</span></div>
<div id="app"></div>
<div class="tabbar" id="tabbar"></div>
<div id="toastwrap"></div>

<script>
"use strict";
/* ============================================================
   SHOT LOGGER — standalone PWA
   yardage · club · lie · result · GPS · SG-lite
   ============================================================ */

// ---------- constants ----------
const DEFAULT_CLUBS = ["Dr","3W","4H","5i","6i","7i","8i","9i","PW","GW","SW","60°"];
const RESULTS = [
  {key:"target",label:"On target"},{key:"short",label:"Short"},{key:"long",label:"Long"},
  {key:"left",label:"Miss left"},{key:"right",label:"Miss right"},
  {key:"mishit",label:"Fat / thin"},{key:"penalty",label:"Penalty"},
];
const RL = Object.fromEntries(RESULTS.map(r=>[r.key,r.label]));
const LIES = [
  {key:"tee",label:"Tee"},{key:"fairway",label:"Fwy"},{key:"rough",label:"Rough"},
  {key:"sand",label:"Sand"},{key:"trees",label:"Trees"},
];
const LL = {tee:"Tee",fairway:"Fairway",rough:"Rough",sand:"Sand",trees:"Trees"};

// Full verified pars from Golf Canada scorecards (Jul 2026)
const EAST_PARS = [5,3,4,5,5,3,4,3,4,5,4,4,3,4,4,3,4,5]; // par 72
const WEST_PARS = [4,3,4,3,5,5,3,4,4,4,4,4,4,3,4,5,4,3]; // par 70
const PARS_VERSION = 2;

const KEY = "gsl3";
const APP_VERSION = "v24"; // keep in sync with sw.js CACHE version

// ---------- Broadie-style scratch baselines (expected strokes to hole out) ----------
// distance in yards -> expected strokes; linear interpolation between anchors
const BASE = {
  tee:     [[100,2.92],[140,2.97],[180,3.05],[220,3.17],[260,3.45],[300,3.71],[340,3.86],[380,3.96],[420,4.02],[460,4.17],[500,4.41],[540,4.65],[600,4.82]],
  fairway: [[10,2.18],[20,2.40],[40,2.60],[60,2.70],[80,2.75],[100,2.80],[120,2.85],[140,2.91],[160,2.98],[180,3.08],[200,3.19],[220,3.32],[240,3.45],[260,3.58],[300,3.78],[340,3.88],[400,4.11],[460,4.29],[520,4.66],[600,5.00]],
  rough:   [[10,2.34],[20,2.59],[40,2.78],[60,2.91],[80,2.96],[100,3.02],[120,3.08],[140,3.15],[160,3.23],[180,3.31],[200,3.42],[220,3.53],[240,3.64],[260,3.74],[300,3.90],[340,4.02],[400,4.30],[460,4.48],[520,4.85],[600,5.19]],
  sand:    [[10,2.43],[20,2.53],[40,2.82],[60,3.15],[80,3.24],[100,3.23],[120,3.21],[140,3.22],[160,3.28],[180,3.40],[200,3.55],[220,3.70],[240,3.84],[280,4.00],[320,4.12],[400,4.69],[500,5.11],[600,5.60]],
  trees:   [[10,2.90],[40,3.20],[80,3.40],[120,3.50],[160,3.65],[200,3.80],[240,4.00],[300,4.30],[400,4.70],[500,5.20],[600,5.70]],
};
const PUTT = [[3,1.04],[5,1.23],[10,1.61],[15,1.78],[20,1.87],[30,1.98],[40,2.06],[60,2.21],[90,2.40]]; // feet
function interp(tbl,x){
  if(x<=tbl[0][0]) return tbl[0][1];
  if(x>=tbl[tbl.length-1][0]) return tbl[tbl.length-1][1];
  for(let i=1;i<tbl.length;i++){
    if(x<=tbl[i][0]){
      const [x0,y0]=tbl[i-1],[x1,y1]=tbl[i];
      return y0+(y1-y0)*(x-x0)/(x1-x0);
    }
  }
  return tbl[tbl.length-1][1];
}
const E = (lie,yds)=> interp(BASE[lie]||BASE.rough, yds);
const Eputt = (ft)=> interp(PUTT, ft);
// modelled end-state when the shot is the last logged on a hole (ball at/near green)
function endStateE(result){
  switch(result){
    case "target": return Eputt(25);          // on green ~25 ft
    case "short": case "long": case "left": case "right": return E("rough",18); // greenside
    case "mishit": return E("rough",35);
    default: return null;
  }
}

// ---------- helpers ----------
const uid = ()=>Math.random().toString(36).slice(2,9);
const todayISO = ()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;};
const fmtDate = iso=>{if(!iso)return "";const[y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-CA",{month:"short",day:"numeric",year:"numeric"});};
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function haversineYds(a,b){
  if(!a||!b)return null;
  const R=6371000,rad=x=>x*Math.PI/180;
  const dLat=rad(b.lat-a.lat),dLng=rad(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h))*1.09361;
}

// ---------- state ----------
let S = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d=JSON.parse(raw);
      if(!d.courses||!d.courses.length) d.courses=defaultCourses();
      // migrate: overwrite known-course pars with verified scorecard data
      if(d.parsVersion!==PARS_VERSION){
        d.courses.forEach(c=>{
          if(c.id==="sdg-east")c.pars=[...EAST_PARS];
          if(c.id==="sdg-west")c.pars=[...WEST_PARS];
        });
        d.parsVersion=PARS_VERSION;
        try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){}
      }
      (d.rounds||[]).forEach(r=>{ if(!r.scores)r.scores={}; if(!r.putts)r.putts={}; if(!r.cands)r.cands=[]; });
      if(!("logMode" in d))d.logMode="quick";
      if(d.basemap==="clar")d.basemap="on"; // Clarity retired: imagery predates course changes
      return d;
    }
  }catch(e){}
  return {clubs:[...DEFAULT_CLUBS], courses:defaultCourses(), rounds:[], activeId:null, parsVersion:PARS_VERSION, logMode:"quick"};
}
function defaultCourses(){
  return [
    {id:"sdg-east",name:"Sunningdale East (Thompson)",pars:[...EAST_PARS],greens:{}},
    {id:"sdg-west",name:"Sunningdale West (Robinson)",pars:[...WEST_PARS],greens:{}},
  ];
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){console.error(e);} }

// UI state
let ui = {tab:"log", hole:1, dist:"", club:null, lie:"tee", lastShotId:null,
          pickCourse:null, pickDate:todayISO(), statScope:"all", statCourse:"all",
          gpsFix:null, gpsAt:0, renaming:null};

const active = ()=> S.rounds.find(r=>r.id===S.activeId)||null;
const activeCourse = ()=>{const a=active(); return a? S.courses.find(c=>c.id===a.courseId):null;};

// ---------- GPS ----------
// burst GPS: sample for up to `ms`, finish early at `goodEnough` metres,
// return the average of the best readings (beats any single first fix)
function getFix(cb, ms=4000, goodEnough=6){
  if(!navigator.geolocation){cb&&cb(null);return;}
  let best=null, samples=[], done=false;
  const id=navigator.geolocation.watchPosition(p=>{
    const f={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
    samples.push(f);
    if(!best||f.acc<best.acc)best=f;
    if(f.acc<=goodEnough)finish();
  },()=>{ if(!best)finish(); },{enableHighAccuracy:true,maximumAge:0,timeout:ms});
  const timer=setTimeout(finish, ms);
  function finish(){
    if(done)return; done=true;
    clearTimeout(timer);
    navigator.geolocation.clearWatch(id);
    let out=best;
    if(best){
      const good=samples.filter(s=>s.acc<=best.acc*1.5);
      if(good.length>1){
        out={lat:good.reduce((a,s)=>a+s.lat,0)/good.length,
             lng:good.reduce((a,s)=>a+s.lng,0)/good.length,
             acc:best.acc, n:good.length};
      }
      ui.gpsFix=out; ui.gpsAt=Date.now();
    }
    cb&&cb(out); renderStatus(); renderGreenDist();
  }
}
function refreshGPS(){ getFix(f=>{ toast(f?`GPS ±${Math.round(f.acc)}m${f.n?` (avg of ${f.n})`:""}`:"No GPS fix"); }, 6000, 5); }
function setGreenPt(part){
  const c=activeCourse(); if(!c){toast("Start a round first");return;}
  toast("Hold still — locking GPS…");
  getFix(f=>{
    if(!f){toast("No GPS fix — try again outside");return;}
    let g=c.greens[ui.hole];
    if(!g||g.lat!=null) g = g? {center:{lat:g.lat,lng:g.lng}} : {};  // migrate legacy single-point tag
    g[part]={lat:f.lat,lng:f.lng};
    g.src=g.src||{}; g.src[part]="gps";
    c.greens[ui.hole]=g; S.anchor={lat:f.lat,lng:f.lng}; save();
    const n=backfillDists(c.id, ui.hole);
    toast(`Green ${ui.hole} ${part.toUpperCase()} tagged ±${Math.round(f.acc)}m ✓${n?` · ${n} yardages backfilled`:""}`);
    renderGreenDist();
  }, 9000, 4);
}
// once a green exists, stamp GPS-derived yardage on any past pinned shots that lack one
function backfillDists(courseId, hole){
  let n=0;
  for(const r of S.rounds){
    if(r.courseId!==courseId)continue;
    for(const s of r.shots){
      if(s.h!==hole||s.d!=null||s.lat==null)continue;
      const ad=autoDist(r,s);
      if(ad!=null){s.d=ad;s.dsrc="gps";n++;}
    }
  }
  if(n)save();
  return n;
}
// normalized green points for a hole: {front?,center?,back?}; legacy {lat,lng} = center
function greenPts(c,h){
  const g=c&&c.greens[h]; if(!g)return null;
  if(g.lat!=null)return {center:{lat:g.lat,lng:g.lng}};
  return (g.front||g.center||g.back)?g:null;
}
// best single reference point for carry math: center, else midpoint(front,back), else whichever exists
function greenCenter(c,h){
  const g=greenPts(c,h); if(!g)return null;
  if(g.center)return g.center;
  if(g.front&&g.back)return {lat:(g.front.lat+g.back.lat)/2,lng:(g.front.lng+g.back.lng)/2};
  return g.front||g.back||null;
}
function greenDists(){
  const c=activeCourse(); if(!c||!ui.gpsFix)return null;
  if(Date.now()-ui.gpsAt>120000)return null;
  const g=greenPts(c,ui.hole); if(!g)return null;
  const out={};
  for(const k of ["front","center","back"]){
    if(g[k])out[k]=Math.round(haversineYds(ui.gpsFix,g[k]));
  }
  if(!out.center&&g.front&&g.back)out.center=Math.round(haversineYds(ui.gpsFix,greenCenter(c,ui.hole)));
  return Object.keys(out).length?out:null;
}

// ---------- hole map: trace + place any shot ----------
let mapObj=null, mapCtx=null; // mapCtx = {roundId, hole, sel} ; sel = shot id | "end" | null
function openMap(){ const a=active(); if(!a){toast("Start a round first");return;} openMapFor(a.id, ui.hole); }
function openMapFor(roundId, hole, guided){
  const r=S.rounds.find(x=>x.id===roundId); if(!r)return;
  const holeShots=r.shots.filter(s=>s.h===hole);
  if(!holeShots.length){toast("No shots on this hole yet");return;}
  if(typeof L==="undefined"){toast("Map needs a data connection");return;}
  const c=S.courses.find(x=>x.id===r.courseId);
  const firstPin=holeShots.find(s=>s.lat!=null);
  const ctr = greenCenter(c,hole) || (firstPin?{lat:firstPin.lat,lng:firstPin.lng}:null) || ui.gpsFix;
  if(!ctr){toast("No position yet — tap ⟳ first");return;}
  mapCtx={roundId, hole, sel:null, guided:!!guided};
  if(guided){ const u=holeShots.find(s=>s.lat==null); if(u)mapCtx.sel=u.id; }
  const ov=document.createElement("div");
  ov.id="mapov";
  ov.innerHTML=`<div class="hint" id="maphint">Hole ${hole} — tap a shot below to place it</div>
    <button class="lyrbtn" id="lyrbtn" onclick="cycleBase('shot')">🛰 ${curBase().name}</button>
    <div class="maparea"><div id="mapdiv"></div>
      <div class="cross" id="mapcross" style="display:none"><i></i></div></div>
    <div class="chips" id="mapchips"></div>
    <div class="bar">
      <button style="background:#3A4A40;color:var(--paper)" onclick="closeMap()">CLOSE</button>
      <button id="mapok" style="background:var(--green);color:var(--paper);display:none" onclick="confirmMap()">✓ PLACE HERE</button>
    </div>`;
  document.body.appendChild(ov);
  mapObj=L.map("mapdiv",{center:[ctr.lat,ctr.lng],zoom:18,zoomControl:false,attributionControl:false});
  addBase(mapObj);
  mapObj.on("click",e=>{ if(mapCtx&&mapCtx.sel)mapPlace(e.latlng); });
  drawHole();
  renderMapChips();
}
function mapRound(){ return S.rounds.find(x=>x.id===mapCtx.roundId); }
let mapLayers=[];
function drawHole(){
  mapLayers.forEach(l=>mapObj.removeLayer(l)); mapLayers=[];
  const r=mapRound(); if(!r)return;
  const c=S.courses.find(x=>x.id===r.courseId);
  const holeShots=r.shots.filter(s=>s.h===mapCtx.hole);
  // green tags (red dots)
  const g=greenPts(c,mapCtx.hole);
  if(g)for(const k of ["front","center","back"])if(g[k])
    mapLayers.push(L.circleMarker([g[k].lat,g[k].lng],{radius:6,color:"#B7222F",fillColor:"#B7222F",fillOpacity:.9}).addTo(mapObj));
  // trace: shot starts in order, then end mark or green center
  const pts=[];
  holeShots.forEach((s,i)=>{
    if(s.lat!=null){
      pts.push([s.lat,s.lng]);
      mapLayers.push(L.marker([s.lat,s.lng],{icon:L.divIcon({className:"",html:`<div class="pinbadge">${i+1}</div>`,iconSize:[22,22],iconAnchor:[11,11]})}).addTo(mapObj));
    }
  });
  const last=holeShots[holeShots.length-1];
  let endPt=null;
  if(last&&last.el!=null)endPt=[last.el,last.elng];
  else{const gc=greenCenter(c,mapCtx.hole); if(gc&&pts.length)endPt=[gc.lat,gc.lng];}
  if(endPt){
    pts.push(endPt);
    mapLayers.push(L.marker(endPt,{icon:L.divIcon({className:"",html:`<div class="pinbadge end">●</div>`,iconSize:[22,22],iconAnchor:[11,11]})}).addTo(mapObj));
  }
  if(pts.length>1)mapLayers.push(L.polyline(pts,{color:"#F0B429",weight:3,opacity:.9,dashArray:"6 6"}).addTo(mapObj));
}
function renderMapChips(){
  const r=mapRound(); if(!r)return;
  const holeShots=r.shots.filter(s=>s.h===mapCtx.hole);
  const el=document.getElementById("mapchips");
  el.innerHTML = holeShots.map((s,i)=>
    `<button class="${mapCtx.sel===s.id?"sel":""}" onclick="mapSelect('${s.id}')">${i+1} · ${esc(s.c)}${s.lat!=null?"":" ⚠"}</button>`).join("")
    +`<button class="${mapCtx.sel==="end"?"sel":""}" onclick="mapSelect('end')">● BALL END</button>`;
  const hint=document.getElementById("maphint"), cross=document.getElementById("mapcross"), ok=document.getElementById("mapok");
  if(mapCtx.sel){
    const _s=holeShots.find(s=>s.id===mapCtx.sel);
    const label=mapCtx.sel==="end"?"final ball position":`shot ${holeShots.findIndex(s=>s.id===mapCtx.sel)+1} — where you hit the ${_s?_s.c:""}`;
    hint.textContent="Tap the map at "+label;
    cross.style.display="block"; ok.style.display="block";
  }else{
    hint.textContent="Hole "+mapCtx.hole+" — tap a shot below to place it";
    cross.style.display="none"; ok.style.display="none";
  }
}
function mapSelect(id){
  mapCtx.sel = (mapCtx.sel===id)? null : id;
  // jump map to existing position if the target already has one
  const r=mapRound();
  if(mapCtx.sel&&mapCtx.sel!=="end"){
    const s=r.shots.find(x=>x.id===mapCtx.sel);
    if(s&&s.lat!=null)mapObj.panTo([s.lat,s.lng]);
  }
  renderMapChips();
}
function confirmMap(){ if(mapObj&&mapCtx&&mapCtx.sel)mapPlace(mapObj.getCenter()); }
function mapPlace(p){
  const r=mapRound(); if(!r||!mapCtx.sel)return;
  const holeShots=r.shots.filter(s=>s.h===mapCtx.hole);
  if(mapCtx.sel==="end"){
    const last=holeShots[holeShots.length-1];
    if(last){last.el=p.lat; last.elng=p.lng;}
  }else{
    const s=r.shots.find(x=>x.id===mapCtx.sel);
    if(s){s.lat=p.lat; s.lng=p.lng;}
  }
  save();
  if(mapCtx.guided){
    const nxt=r.shots.filter(s=>s.h===mapCtx.hole).find(s=>s.lat==null);
    mapCtx.sel=nxt?nxt.id:null;
    if(!nxt){
      let n=0;
      r.shots.filter(s=>s.h===mapCtx.hole).forEach(s=>{
        if(s.d==null){const ad=autoDist(r,s); if(ad!=null){s.d=ad;s.dsrc="map";n++;}}
      });
      save(); drawHole(); renderMapChips();
      toast(n?`All placed ✓ — ${n} yardages computed`:"All shots placed ✓");
      return;
    }
  } else mapCtx.sel=null;
  drawHole(); renderMapChips();
  const s2=r.shots.find(x=>x.id===mapCtx.sel);
  toast(mapCtx.guided&&s2?`Placed ✓ — now tap where you hit the ${s2.c}`:"Placed ✓");
}
function closeMap(){
  if(mapObj){mapObj.remove();mapObj=null;}
  mapLayers=[]; mapCtx=null;
  const ov=document.getElementById("mapov"); if(ov)ov.remove();
  render();
}



// ---------- basemaps ----------
const BASEMAPS=[
  {id:"on",  name:"Ontario 16cm · spr 2025", url:"https://ws.lioservices.lrc.gov.on.ca/arcgis2/rest/services/LIO_Imagery/Ontario_Imagery_Web_Map_Service/MapServer/tile/{z}/{y}/{x}", maxNative:20},
  {id:"esri",name:"Esri World · older",      url:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", maxNative:19},
];
function curBase(){ return BASEMAPS.find(b=>b.id===(S.basemap||"on"))||BASEMAPS[0]; }
function addBase(map){
  const b=curBase();
  let errs=0;
  const layer=L.tileLayer(b.url,{maxZoom:22,maxNativeZoom:b.maxNative}).addTo(map);
  layer.on("tileerror",()=>{
    if(++errs===8&&b.id!=="esri"){ S.basemap="esri"; save();
      toast("⚠ Ontario imagery not responding — using Esri (older)");
      map.removeLayer(layer); addBase(map);
      const btn=document.getElementById("lyrbtn"); if(btn)btn.textContent="🛰 "+curBase().name; }
  });
  return layer;
}
function cycleBase(which){
  const i=BASEMAPS.findIndex(b=>b.id===(S.basemap||"on"));
  S.basemap=BASEMAPS[(i+1)%BASEMAPS.length].id; save();
  const map = which==="green"?gmObj:mapObj;
  if(map){ map.eachLayer(l=>{ if(l instanceof L.TileLayer)map.removeLayer(l); }); addBase(map); }
  const btn=document.getElementById("lyrbtn"); if(btn)btn.textContent="🛰 "+curBase().name;
  toast(curBase().name);
}

// ---------- satellite green setup (pre-tag from the couch) ----------
let gmObj=null, gmCtx=null, gmLayers=[];
function openGreenMap(courseId,hole){
  const c=S.courses.find(x=>x.id===courseId); if(!c)return;
  if(typeof L==="undefined"){toast("Map needs a data connection");return;}
  gmCtx={courseId,hole,sel:null};
  closeGreenMap(true);
  const ctr=gmCenter(c,hole);
  const ov=document.createElement("div");
  ov.id="mapov";
  ov.innerHTML=`<div class="hint" id="gmhint">Green ${hole} — tap F / C / B, then tap the green</div>
    <button class="lyrbtn" id="lyrbtn" onclick="cycleBase('green')">🛰 ${curBase().name}</button>
    <div class="maparea"><div id="mapdiv"></div>
      <div class="cross" id="gmcross" style="display:none"><i></i></div></div>
    <div class="chips" id="gmchips"></div>
    <div class="bar">
      <button style="background:#2A3A31;color:var(--tx)" onclick="gmHole(-1)">‹ HOLE</button>
      <button id="gmok" style="background:linear-gradient(160deg,#3FBF7A,#1F8A52);color:#06180E;display:none" onclick="gmConfirm()">✓ PLACE</button>
      <button style="background:#2A3A31;color:var(--tx)" onclick="closeGreenMap()">DONE</button>
      <button style="background:#2A3A31;color:var(--tx)" onclick="gmHole(1)">HOLE ›</button>
    </div>`;
  document.body.appendChild(ov);
  gmObj=L.map("mapdiv",{center:[ctr.lat,ctr.lng],zoom:ctr.z,zoomControl:false,attributionControl:false});
  addBase(gmObj);

  gmDraw(); gmChips();
}
// centring: this hole's tags > nearest tagged green > live GPS > saved anchor > London approx
function gmCenter(c,hole){
  const g=greenPts(c,hole);
  if(g){const p=g.center||g.front||g.back; return {lat:p.lat,lng:p.lng,z:19};}
  let near=null,bd=99;
  for(let h=1;h<=18;h++){
    const gg=greenPts(c,h); if(!gg)continue;
    const d=Math.abs(h-hole); if(d<bd){bd=d;near=gg.center||gg.front||gg.back;}
  }
  if(near)return {lat:near.lat,lng:near.lng,z:18};
  if(ui.gpsFix)return {lat:ui.gpsFix.lat,lng:ui.gpsFix.lng,z:15};
  if(S.anchor)return {lat:S.anchor.lat,lng:S.anchor.lng,z:16};
  return {lat:43.0355,lng:-81.2955,z:14}; // 465 Sunningdale Rd W area — pan to the course first time
}
function gmDraw(){
  gmLayers.forEach(l=>gmObj.removeLayer(l)); gmLayers=[];
  const c=S.courses.find(x=>x.id===gmCtx.courseId);
  const g=greenPts(c,gmCtx.hole);
  if(g)for(const k of ["front","center","back"]){
    if(!g[k])continue;
    const byMap=(g.src&&g.src[k])==="map";
    const col=byMap?"#F5C451":"#3FBF7A";
    gmLayers.push(L.marker([g[k].lat,g[k].lng],{icon:L.divIcon({className:"",
      html:`<div style="background:${col};color:#0A1410;border-radius:50%;width:24px;height:24px;
        display:flex;align-items:center;justify-content:center;font:700 12px 'IBM Plex Mono',monospace;
        border:2px solid #0A1410;box-shadow:0 2px 6px rgba(0,0,0,.6)">${k[0].toUpperCase()}</div>`,
      iconSize:[24,24],iconAnchor:[12,12]})}).addTo(gmObj));
  }
  if(g&&g.front&&g.back)gmLayers.push(L.polyline([[g.front.lat,g.front.lng],[g.back.lat,g.back.lng]],
    {color:"#F5C451",weight:2,dashArray:"5 5",opacity:.85}).addTo(gmObj));
  // neighbouring greens for orientation
  for(let h=1;h<=18;h++){
    if(h===gmCtx.hole)continue;
    const gg=greenPts(c,h); if(!gg)continue;
    const p=gg.center||gg.front||gg.back;
    gmLayers.push(L.circleMarker([p.lat,p.lng],{radius:5,color:"rgba(255,255,255,.5)",
      fillColor:"rgba(255,255,255,.25)",fillOpacity:.6,weight:1}).addTo(gmObj));
  }
}
function gmChips(){
  const c=S.courses.find(x=>x.id===gmCtx.courseId);
  const g=greenPts(c,gmCtx.hole)||{};
  const dep=(g.front&&g.back)?Math.round(haversineYds(g.front,g.back)):null;
  document.getElementById("gmchips").innerHTML=
    ["front","center","back"].map(k=>{
      const has=!!g[k]; const src=(g.src&&g.src[k])||"";
      return `<button class="${gmCtx.sel===k?"sel":""}" onclick="gmSelect('${k}')">${k.toUpperCase()}${has?` ✓${src==="gps"?"gps":"map"}`:""}</button>`;
    }).join("")
    +`<button onclick="gmClear()" style="color:#FF6B7A">clear hole</button>`
    +`<button onclick="cycleBase('green')" style="color:#8FE3AF">🛰 ${curBase().name}</button>`
    +(dep?`<span style="flex-shrink:0;padding:9px 12px;font-family:var(--mono);font-size:12px;color:#8FE3AF">depth ${dep}y</span>`:"");
  const hint=document.getElementById("gmhint"),cross=document.getElementById("gmcross"),ok=document.getElementById("gmok");
  if(gmCtx.sel){
    hint.textContent=`Tap the ${gmCtx.sel.toUpperCase()} edge of green ${gmCtx.hole}`;
    cross.style.display="block"; ok.style.display="block";
  }else{
    hint.textContent=`Green ${gmCtx.hole} — tap F / C / B to place`;
    cross.style.display="none"; ok.style.display="none";
  }
}
function gmSelect(k){
  gmCtx.sel=(gmCtx.sel===k)?null:k;
  const c=S.courses.find(x=>x.id===gmCtx.courseId);
  const g=greenPts(c,gmCtx.hole);
  if(gmCtx.sel&&g&&g[gmCtx.sel])gmObj.panTo([g[gmCtx.sel].lat,g[gmCtx.sel].lng]);

}
function gmConfirm(){ if(gmObj&&gmCtx&&gmCtx.sel)gmPlace(gmObj.getCenter()); }
function gmPlace(p){
  const c=S.courses.find(x=>x.id===gmCtx.courseId); if(!c||!gmCtx.sel)return;
  let g=c.greens[gmCtx.hole];
  if(!g||g.lat!=null) g = g? {center:{lat:g.lat,lng:g.lng}} : {};
  g[gmCtx.sel]={lat:p.lat,lng:p.lng};

}
function gmClear(){
  const c=S.courses.find(x=>x.id===gmCtx.courseId); if(!c)return;
  delete c.greens[gmCtx.hole]; save(); gmCtx.sel=null; gmDraw(); gmChips();

function gmHole(step){

function closeGreenMap(quiet){

}

// suggest a club from the club book (pure yards on target-marked shots) for the typed yardage
function suggestClub(yds){
  if(!yds||yds<30)return null;
  let best=null,bestDiff=18; // within 18 yds
  for(const cl of S.clubs){
    const ss=S.rounds.flatMap(r=>r.shots).filter(s=>s.c===cl&&s.r==="target"&&s.d);
    if(ss.length<3)continue; // need a few data points before trusting
    const pure=ss.reduce((a,s)=>a+s.d,0)/ss.length;
    const diff=Math.abs(pure-yds);
    if(diff<bestDiff){bestDiff=diff;best=cl;}
  }
  return best;
}

// reference point on the green, honouring today's pin position (F/M/B)
function greenRef(c,h,round){
  const g=greenPts(c,h); if(!g)return null;
  const pos=(round&&round.pinPos)||"M";
  if(pos==="F"&&g.front)return g.front;
  if(pos==="B"&&g.back)return g.back;
  return greenCenter(c,h);
}
function setPin(p){ const a=active(); if(!a)return; a.pinPos=p; save(); render(); toast("Pin: "+({F:"front",M:"middle",B:"back"})[p]); }
// distance from a shot's position to today's pin reference
function autoDist(round,shot){
  if(shot.lat==null)return null;
  const c=S.courses.find(x=>x.id===round.courseId);
  const gc=greenRef(c,shot.h,round); if(!gc)return null;
  const d=Math.round(haversineYds(shot,gc));
  return (d>=15&&d<=280)?d:null;
}

// ============ AUTO-PIN: dwell detection ============
// The cart stops where the ball is. We can't feel a swing (phone is on the cart,
// not your body) but we CAN notice "stopped here a while" and bank the position.
// Position is the perishable data; the club is what you can still recall at the tee.
let autoWatch=null, dwell=null;
const DWELL_MS=25000, DWELL_RADIUS_M=9, NEW_PIN_YDS=22;
function toggleAuto(){
  S.autoPin=!S.autoPin; save();
  if(S.autoPin){ startAuto(); toast("Auto-pin ON — keep the app open; costs battery"); }
  else { stopAuto(); toast("Auto-pin off"); }
  render();
}
function startAuto(){
  if(!navigator.geolocation||autoWatch!=null||!active())return;
  autoWatch=navigator.geolocation.watchPosition(onAutoPos,()=>{},
    {enableHighAccuracy:true,maximumAge:4000,timeout:25000});
}
function stopAuto(){
  if(autoWatch!=null){navigator.geolocation.clearWatch(autoWatch);autoWatch=null;}
  dwell=null;
}
function onAutoPos(p){
  const f={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};
  ui.gpsFix={lat:f.lat,lng:f.lng,acc:f.acc}; ui.gpsAt=f.t;
  renderStatus(); renderGreenDist();
  if(f.acc>25)return;                                  // too coarse to trust
  if(!dwell||haversineYds(dwell,f)/1.09361>DWELL_RADIUS_M){
    dwell={lat:f.lat,lng:f.lng,t0:f.t,n:1,sLat:f.lat,sLng:f.lng,fired:false};
    return;
  }
  dwell.n++; dwell.sLat+=f.lat; dwell.sLng+=f.lng;
  if(!dwell.fired && f.t-dwell.t0>=DWELL_MS){
    dwell.fired=true;
    addCandidate(dwell.sLat/dwell.n, dwell.sLng/dwell.n);
  }
}
function addCandidate(lat,lng){
  const a=active(); if(!a)return;
  a.cands=a.cands||[];
  const here={lat,lng};
  // ignore if it coincides with something already recorded on this hole
  const near=[...a.shots.filter(s=>s.h===ui.hole&&s.lat!=null),
              ...a.cands.filter(c=>c.h===ui.hole)]
             .some(o=>haversineYds(o,here)<NEW_PIN_YDS);
  if(near)return;
  a.cands.push({id:uid(),h:ui.hole,lat,lng,ts:Date.now()});
  save(); render();
  toast("📍 Auto-pin dropped — assign a club at the tee");
}
function candAssign(cid,club){
  const a=active(); if(!a||!a.cands)return;
  const ci=a.cands.findIndex(x=>x.id===cid); if(ci<0)return;
  const cd=a.cands[ci];
  const shot={id:uid(),h:cd.h,d:null,c:club,lie:"fairway",r:null,ts:cd.ts,lat:cd.lat,lng:cd.lng};
  let ins=a.shots.findIndex(s=>s.ts>cd.ts); if(ins<0)ins=a.shots.length;
  a.shots.splice(ins,0,shot);
  const hs=a.shots.filter(s=>s.h===cd.h);
  if(hs[0].id===shot.id)shot.lie="tee";
  a.cands.splice(ci,1); save(); render();
  toast(`${club} assigned to auto-pin ✓`);
}
function candDrop(cid){
  const a=active(); if(!a||!a.cands)return;
  a.cands=a.cands.filter(x=>x.id!==cid); save(); render();
  toast("Auto-pin dismissed");
}

// ============ GEOMETRIC RESULT INFERENCE ============
function toXY(o,ref){
  return {x:(o.lng-ref.lng)*111320*Math.cos(ref.lat*Math.PI/180), y:(o.lat-ref.lat)*110540};
}
const M2Y=1.09361;
function maxReachYds(){
  let mx=0;
  for(const cl of S.clubs){
    const ss=S.rounds.flatMap(r=>r.shots).filter(s=>s.c===cl&&s.r==="target"&&s.d);
    if(ss.length<3)continue;
    mx=Math.max(mx,ss.reduce((a,s)=>a+s.d,0)/ss.length);
  }
  return mx?mx+15:245;
}
function clubPureYds(cl){
  const ss=S.rounds.flatMap(r=>r.shots).filter(s=>s.c===cl&&s.r==="target"&&s.d);
  if(ss.length<3)return null;
  return ss.reduce((a,s)=>a+s.d,0)/ss.length;
}
function greenRadiusYds(c,h){
  const g=greenPts(c,h);
  if(g&&g.front&&g.back)return Math.max(10,haversineYds(g.front,g.back)/2+6);
  return 16;
}
// infer {r,why} for a shot from its pin, the next pin (or ball-end), and the green
function inferResult(round,shot){
  if(shot.lat==null)return null;
  const c=S.courses.find(x=>x.id===round.courseId);
  const G=greenRef(c,shot.h,round);
  const same=round.shots.filter(s=>s.h===shot.h);
  const idx=same.findIndex(s=>s.id===shot.id);
  const nxt=same[idx+1];
  let endPt=null;
  if(shot.el!=null)endPt={lat:shot.el,lng:shot.elng};
  else if(nxt&&nxt.lat!=null)endPt={lat:nxt.lat,lng:nxt.lng};
  else if(idx===same.length-1&&round.putts&&round.putts[shot.h]!=null&&G)
    return {r:"target",why:"last stroke before putting"};
  if(!endPt||!G)return null;

  const E=toXY(endPt,shot), T=toXY(G,shot);
  const tLen=Math.hypot(T.x,T.y); if(tLen<1)return null;
  const ux=T.x/tLen, uy=T.y/tLen;
  const along=(E.x*ux+E.y*uy)*M2Y;
  const cross=(T.x*E.y-T.y*E.x);
  const lateral=Math.abs(-uy*E.x+ux*E.y)*M2Y;
  const dBefore=tLen*M2Y;
  const dAfter=haversineYds(endPt,G);
  const carry=haversineYds(shot,endPt);
  const R=greenRadiusYds(c,shot.h);

  if(dAfter<=R)return {r:"target",why:`finished ${Math.round(dAfter)}y from centre`};
  const pure=clubPureYds(shot.c);
  if(pure&&carry>0&&carry<pure*0.55)
    return {r:"mishit",why:`only ${Math.round(carry)}y vs ${Math.round(pure)}y typical`};
  const goingForGreen = dBefore<=maxReachYds();
  const latThresh=Math.max(11,carry*0.07);
  if(lateral>latThresh && (!goingForGreen || lateral>Math.abs(dBefore-along)))
    return {r:cross>0?"left":"right",why:`${Math.round(lateral)}y ${cross>0?"left":"right"} of line`};
  if(goingForGreen){
    if(dBefore-along>R)return {r:"short",why:`${Math.round(dBefore-along)}y short of centre`};
    if(along-dBefore>R)return {r:"long",why:`${Math.round(along-dBefore)}y past centre`};
  }
  return {r:"target",why:`${Math.round(carry)}y, ${Math.round(lateral)}y off line`};
}
function lieAfter(r){
  return ({target:"fairway",left:"rough",right:"rough",mishit:"rough",
           short:"rough",long:"rough",penalty:"trees"})[r]||"fairway";
}
function acceptHole(hole){
  const a=active(); if(!a)return;

  let n=0;
  hs.forEach((s,i)=>{
    if(!s.r){ const inf=inferResult(a,s); if(inf){s.r=inf.r;n++;} }
    if(i>0 && !s.lieSet){ const prev=hs[i-1]; if(prev.r)s.lie=lieAfter(prev.r); }
    if(s.r&&s.d==null){const ad=autoDist(a,s); if(ad!=null){s.d=ad;s.dsrc="gps";}}
  });
  save(); render();
  toast(n?`${n} stroke${n>1?"s":""} confirmed ✓ — fix sand/trees if any`:"Nothing to infer — need GPS pins or a next shot");
}

function runningVsPar(r){

// per-round derived scoring stats
function roundScoring(r){
  const c=S.courses.find(x=>x.id===r.courseId); if(!c)return null;
  let fwHit=0,fwOpp=0,gir=0,girOpp=0,scr=0,scrOpp=0,ss=0,ssOpp=0,tot=0,par=0,holes=0;
  for(let h=1;h<=18;h++){
    const sc=r.scores[h], p=c.pars[h-1], pu=r.putts[h];
    const hs=r.shots.filter(s=>s.h===h);
    // fairway: first tee shot on par 4/5
    if(p>3){
      const teeShot=hs.find(s=>s.lie==="tee");
      if(teeShot&&teeShot.r){fwOpp++; if(teeShot.r==="target")fwHit++;}
    }
    if(sc!=null){tot+=sc;par+=p;holes++;}
    if(sc!=null&&pu!=null){
      const onGreen=(sc-pu)<=(p-2);
      girOpp++; if(onGreen)gir++;
      if(!onGreen){scrOpp++; if(sc<=p)scr++;}
      if(hs.some(s=>s.lie==="sand"&&(s.d==null||s.d<=60))){ssOpp++; if(sc<=p)ss++;}
    }
  }
  return {fwHit,fwOpp,gir,girOpp,scr,scrOpp,ss,ssOpp,tot,par,holes};
}

// ---------- carries & SG ----------
function shotCarry(round,shot){
  if(shot.lat==null)return null;
  // 1) explicit ball-mark from the map wins
  if(shot.el!=null)return Math.round(haversineYds(shot,{lat:shot.el,lng:shot.elng}));
  const same=round.shots.filter(s=>s.h===shot.h);
  const idx=same.findIndex(s=>s.id===shot.id);
  if(idx>=0&&idx<same.length-1){
    // 2) next shot's GPS pin = where the ball ended
    const nxt=same[idx+1];
    if(nxt.lat!=null)return Math.round(haversineYds(shot,nxt));
  }else{
    // 3) last full shot of the hole: fall back to tagged green center
    const c=S.courses.find(x=>x.id===round.courseId);
    const gc=greenCenter(c,shot.h);
    if(gc)return Math.round(haversineYds(shot,gc));
  }
  return null;
}
// SG-lite per shot: E(before) - E(after) - 1 (modelled end state on final shot of hole)
function shotSG(round,shot){
  if(!shot.d)return null;
  const before=E(shot.lie,shot.d);
  const same=round.shots.filter(s=>s.h===shot.h);
  const idx=same.findIndex(s=>s.id===shot.id);
  let after;
  if(shot.r==="penalty"){
    after=E(shot.lie,shot.d)+1; // stroke+distance approximation: replay-ish
  }else if(idx<same.length-1){
    const nxt=same[idx+1];
    if(!nxt.d)return null;
    after=E(nxt.lie,nxt.d);
  }else{
    after=endStateE(shot.r);
    if(after==null)return null;
  }
  return before-after-1;
}
function sgCategory(shot,round){
  const c=S.courses.find(x=>x.id===round.courseId);
  const par=c?c.pars[shot.h-1]:4;
  if(shot.lie==="tee"&&par>3)return "Tee";
  if(shot.lie==="sand")return "Sand";
  if(shot.d&&shot.d<50)return "Short";
  return "Approach";
}

// ============ SVG GRAPHICS LAYER (v16) ============
const LIECOL={tee:"#8FE3AF",fairway:"#3FBF7A",rough:"#9BA84E",sand:"#E9C46A",trees:"#7A6A55"};
const RESCOL={target:"#3FBF7A",short:"#E9A23B",long:"#E9A23B",left:"#FF8A5C",right:"#FF8A5C",mishit:"#BFCFC5",penalty:"#FF6B7A"};

// Hole schematic: corridor + green + shot arcs, positioned by remaining yardage
function holeSVG(round,hole,W){
  const c=S.courses.find(x=>x.id===round.courseId);
  const par=c?c.pars[hole-1]:4;
  const hs=round.shots.filter(s=>s.h===hole);
  const H=Math.max(210,Math.min(330,150+hs.length*34));
  // hole length: tee shot distance, else par estimate
  const teeD=hs.length&&hs[0].d?hs[0].d:(par===3?165:par===4?395:520);
  const len=Math.max(teeD,60);
  const padT=26,padB=30,corrW=W*0.34,cx=W/2;
  const yFor=rem=>padT+(1-Math.max(0,Math.min(1,rem/len)))*(H-padT-padB);
  const offFor=r=>({left:-corrW*0.62,right:corrW*0.62,target:0,short:0,long:0,mishit:corrW*0.3,penalty:-corrW*0.8}[r]??0);
  let s='';
  // rough + fairway corridor
  s+=`<defs>
    <linearGradient id="fw" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1E5B38"/><stop offset="100%" stop-color="#2C7A4C"/></linearGradient>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16311F"/><stop offset="50%" stop-color="#1B3D26"/><stop offset="100%" stop-color="#16311F"/></linearGradient>
    <radialGradient id="grn"><stop offset="0%" stop-color="#6FE3A2"/><stop offset="100%" stop-color="#2E9A5F"/></radialGradient>
  </defs>`;
  s+=`<rect x="0" y="${padT-14}" width="${W}" height="${H-padT-padB+30}" rx="16" fill="url(#rg)"/>`;
  s+=`<path d="M${cx-corrW/2} ${H-padB} Q${cx-corrW/2-8} ${(H)/2} ${cx-corrW/2+4} ${padT}
       L${cx+corrW/2-4} ${padT} Q${cx+corrW/2+8} ${(H)/2} ${cx+corrW/2} ${H-padB} Z"
       fill="url(#fw)" opacity=".92"/>`;
  // green + pin
  s+=`<ellipse cx="${cx}" cy="${padT-4}" rx="${corrW*0.44}" ry="15" fill="url(#grn)" opacity=".95"/>`;
  s+=`<line x1="${cx}" y1="${padT-8}" x2="${cx}" y2="${padT-24}" stroke="#EAF2EC" stroke-width="1.6"/>`;
  s+=`<path d="M${cx} ${padT-24} L${cx+11} ${padT-20} L${cx} ${padT-16} Z" fill="#FF6B7A"/>`;
  // tee box
  s+=`<rect x="${cx-9}" y="${H-padB+3}" width="18" height="7" rx="2" fill="#8FA79A" opacity=".75"/>`;
  s+=`<text x="${cx}" y="${H-padB+22}" text-anchor="middle" class="gaugelbl" font-size="9">TEE · ${len}y</text>`;
  // shot arcs
  const pts=hs.map((sh,i)=>{
    const rem = sh.d!=null?sh.d:Math.max(0,len-(i+1)*(len/(hs.length+1)));
    return {x:cx+offFor(i===0?"target":hs[i-1].r), y:yFor(rem), sh, i};
  });
  const end={x:cx+offFor(hs.length?hs[hs.length-1].r:"target"), y:padT-4};
  const all=[...pts,end];
  for(let i=0;i<all.length-1;i++){
    const a=all[i],b=all[i+1];
    const mx=(a.x+b.x)/2+(b.x-a.x)*0.15, my=(a.y+b.y)/2-Math.abs(a.y-b.y)*0.38;
    const col=pts[i]&&pts[i].sh?(RESCOL[pts[i].sh.r]||"#8FA79A"):"#8FA79A";
    const dash=pts[i]&&pts[i].sh&&!pts[i].sh.r?"4 4":"0";
    s+=`<path d="M${a.x} ${a.y} Q${mx} ${my} ${b.x} ${b.y}" fill="none" stroke="${col}"
         stroke-width="2.4" stroke-dasharray="${dash}" opacity=".9" stroke-linecap="round"/>`;
  }
  pts.forEach(p=>{
    const col=LIECOL[p.sh.lie]||"#8FE3AF";
    s+=`<circle cx="${p.x}" cy="${p.y}" r="11" fill="#0A1410" stroke="${col}" stroke-width="2.2"/>`;
    s+=`<text x="${p.x}" y="${p.y+3.6}" text-anchor="middle" font-family="'IBM Plex Mono',monospace"
         font-size="10" font-weight="700" fill="${col}">${p.i+1}</text>`;
    if(p.sh.d!=null)s+=`<text x="${p.x+(p.x>cx?16:-16)}" y="${p.y+3}" text-anchor="${p.x>cx?"start":"end"}"
         class="gaugelbl" font-size="9">${p.sh.d}y</text>`;
  });
  return `<svg class="gfx anim" viewBox="0 0 ${W} ${H}" height="${H}">${s}</svg>`;
}

// radial gauge
function gaugeSVG(pct,label,col,size){

// miss rose: directional distribution for a club
function roseSVG(dist,W){
  const H=170,cx=W/2,cy=H*0.62,R=H*0.44;
  const dirs=[["long",-90],["right",-30],["mishit",30],["short",90],["penalty",150],["left",-150]];
  const max=Math.max(1,...dirs.map(d=>dist[d[0]]||0));
  let s=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.08)"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${R*0.5}" fill="none" stroke="rgba(255,255,255,.06)"/>`;
  dirs.forEach(([k,ang])=>{
    const n=dist[k]||0; if(!n)return;
    const len=R*(0.28+0.72*n/max), a=ang*Math.PI/180, w=0.30;
    const x1=cx+Math.cos(a-w)*len, y1=cy+Math.sin(a-w)*len;
    const x2=cx+Math.cos(a+w)*len, y2=cy+Math.sin(a+w)*len;
    s+=`<path d="M${cx} ${cy} L${x1} ${y1} A${len} ${len} 0 0 1 ${x2} ${y2} Z"
         fill="${RESCOL[k]}" opacity=".82"/>`;
    s+=`<text x="${cx+Math.cos(a)*(len+13)}" y="${cy+Math.sin(a)*(len+13)+3}" text-anchor="middle"
         class="gaugelbl" font-size="9.5" fill="${RESCOL[k]}">${n}</text>`;
  });
  const t=dist.target||0;
  s+=`<circle cx="${cx}" cy="${cy}" r="${R*0.24}" fill="#0A1410" stroke="#3FBF7A" stroke-width="2"/>`;
  s+=`<text x="${cx}" y="${cy+4}" text-anchor="middle" class="gaugeval" font-size="13">${t}</text>`;
  s+=`<text x="${cx}" y="${cy-R-6}" text-anchor="middle" class="gaugelbl" font-size="9">LONG</text>`;
  s+=`<text x="${cx}" y="${cy+R+16}" text-anchor="middle" class="gaugelbl" font-size="9">SHORT</text>`;
  s+=`<text x="${cx-R-4}" y="${cy+3}" text-anchor="end" class="gaugelbl" font-size="9">L</text>`;
  s+=`<text x="${cx+R+4}" y="${cy+3}" class="gaugelbl" font-size="9">R</text>`;
  return `<svg class="gfx anim" viewBox="0 0 ${W} ${H}" height="${H}">${s}</svg>`;
}

// gapping ladder: club distances with gap callouts
function gapSVG(rows,W){
  const rs=rows.filter(r=>r.dist).map(r=>({...r,pure:r.dist})).sort((a,b)=>b.pure-a.pure);
  if(!rs.length)return "";
  const rowH=22,H=rs.length*rowH+26,maxD=Math.max(...rs.map(r=>r.pure)),L=42,Rp=42;
  let s=`<line x1="${L}" y1="14" x2="${L}" y2="${H-8}" stroke="rgba(255,255,255,.10)"/>`;
  rs.forEach((r,i)=>{
    const y=20+i*rowH, w=(W-L-Rp)*(r.pure/maxD);
    s+=`<text x="${L-7}" y="${y+4}" text-anchor="end" font-family="'IBM Plex Mono',monospace"
         font-size="11" font-weight="700" fill="#EAF2EC">${r.cl}</text>`;
    s+=`<rect x="${L}" y="${y-6}" width="${w}" height="12" rx="6"
         fill="url(#gapg)" opacity=".95" style="--len:${w};animation:fadein .4s ease both;animation-delay:${i*0.04}s"/>`;
    s+=`<text x="${L+w+7}" y="${y+4}" font-family="'IBM Plex Mono',monospace" font-size="11"
         font-weight="700" fill="#8FE3AF">${r.pure}</text>`;
    if(i<rs.length-1){
      const gap=r.pure-rs[i+1].pure;
      if(gap>=18)s+=`<text x="${W-6}" y="${y+rowH/2+4}" text-anchor="end" class="gaugelbl"
        font-size="9" fill="#FF6B7A">▲${gap}y gap</text>`;
    }
  });
  return `<svg class="gfx anim" viewBox="0 0 ${W} ${H}" height="${H}">
    <defs><linearGradient id="gapg" x1="0" x2="1"><stop offset="0%" stop-color="#2E9A5F"/>
    <stop offset="100%" stop-color="#8FE3AF"/></linearGradient></defs>${s}</svg>`;
}

// score sparkline for trend
function trendSVG(trend,W){
  if(trend.length<2)return "";
  const H=130,P=26,mx=Math.max(...trend.map(t=>t.pct),50),mn=Math.min(...trend.map(t=>t.pct),0);
  const xF=i=>P+i*((W-P*2)/(trend.length-1));
  const yF=v=>H-24-((v-mn)/Math.max(1,mx-mn))*(H-52);
  let pts=trend.map((t,i)=>`${xF(i)},${yF(t.pct)}`).join(" ");
  let s=`<defs><linearGradient id="trg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="rgba(143,227,175,.42)"/><stop offset="100%" stop-color="rgba(143,227,175,0)"/>
    </linearGradient></defs>`;
  s+=`<polygon points="${xF(0)},${H-24} ${pts} ${xF(trend.length-1)},${H-24}" fill="url(#trg)"/>`;
  s+=`<polyline points="${pts}" fill="none" stroke="#8FE3AF" stroke-width="2.6" stroke-linecap="round"
       stroke-linejoin="round"/>`;
  trend.forEach((t,i)=>{
    s+=`<circle cx="${xF(i)}" cy="${yF(t.pct)}" r="${i===trend.length-1?5:3.6}"
         fill="${i===trend.length-1?"#F5C451":"#0A1410"}" stroke="#8FE3AF" stroke-width="2"/>`;
    s+=`<text x="${xF(i)}" y="${yF(t.pct)-11}" text-anchor="middle" class="gaugelbl" font-size="9.5"
         fill="#EAF2EC">${t.pct}%</text>`;
    s+=`<text x="${xF(i)}" y="${H-9}" text-anchor="middle" class="gaugelbl" font-size="8.5">${t.date}</text>`;
  });
  return `<svg class="gfx anim" viewBox="0 0 ${W} ${H}" height="${H}">${s}</svg>`;
}

  return `<div class="sechead"><span class="t">${esc(r.courseName).toUpperCase()}</span>
    <span class="n">${fmtDate(r.date)} · ${r.shots.length} shots</span></div>
  ${(()=>{ if(!c)return "";
    const nine=(start)=>{
      const hs=Array.from({length:9},(_,i)=>start+i);
      const parSum=hs.reduce((x,h)=>x+c.pars[h-1],0);
      const scSum=hs.reduce((x,h)=>x+(r.scores[h]||0),0);
      const scAll=hs.every(h=>r.scores[h]!=null);
      const puSum=hs.reduce((x,h)=>x+(r.putts[h]??0),0);
      const cell=(v,style)=>`<td style="padding:4px 0;text-align:center;font-size:11.5px;${style||""}">${v}</td>`;
      return `<table style="width:100%;border-collapse:collapse;font-family:var(--mono)">
        <tr style="background:var(--ink);color:var(--paper)">${cell("<b>H</b>","font-family:var(--cond)")}${hs.map(h=>cell(h)).join("")}${cell(start===1?"<b>OUT</b>":"<b>IN</b>")}</tr>
        <tr>${cell("Par","color:var(--faint)")}${hs.map(h=>cell(c.pars[h-1],"color:var(--faint)")).join("")}${cell("<b>"+parSum+"</b>")}</tr>
        <tr style="border-top:1px solid var(--line)">${cell("Sc")}${hs.map(h=>{
          const sc=r.scores[h];if(sc==null)return cell("–","color:#C9C7B8");
          const d=sc-c.pars[h-1];
          const col=d<0?"color:var(--green);font-weight:700":d===0?"":d===1?"color:var(--gold)":"color:var(--flag);font-weight:700";
          return cell(sc,col);}).join("")}${cell(scSum?("<b>"+scSum+"</b>"):"–")}</tr>
        <tr style="border-top:1px solid var(--line)">${cell("Pt","color:var(--faint)")}${hs.map(h=>cell(r.putts[h]??"–","color:var(--faint);font-size:10px")).join("")}${cell(puSum||"–","color:var(--faint)")}</tr>
      </table>`;
    };
    const rv=runningVsPar(r);
    return `<div style="margin:0 12px 6px;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:#fff">
      ${nine(1)}<div style="height:6px;background:#F1EFE4"></div>${nine(10)}
      ${rv?`<div style="padding:7px 10px;border-top:1.5px solid var(--ink);display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px">
        <span>TOTAL <b>${rv.n===18?Object.values(r.scores).reduce((a,b)=>a+b,0):"thru "+rv.n}</b></span>
        <span style="font-weight:700;color:${rv.diff>0?"var(--flag)":"var(--green)"}">${rv.diff>0?"+"+rv.diff:rv.diff===0?"EVEN":rv.diff}</span></div>`:""}
    </div>`;})()}
  ${Object.keys(byH).sort((a,b)=>a-b).map(h=>`
    <div style="border-bottom:1px solid var(--line);padding:10px 16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:.1em;color:var(--green)">
        HOLE ${h}${c?` · PAR ${c.pars[h-1]}`:""}${r.putts[h]!=null?` · ${r.putts[h]} PUTTS`:""}</span>
        <button onclick="openMapFor('${r.id}',${h})" style="background:none;border:1px solid var(--line);border-radius:5px;padding:3px 9px;font-family:var(--mono);font-size:11px;color:var(--sage)">🛰 map</button>
      </div>
      ${byH[h].map((s,i)=>{
        const carry=shotCarry(r,s);
        return `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px">
        <span style="color:var(--faint);width:13px">${i+1}</span>
        <span style="width:52px;font-weight:600">${s.d?s.d+"y":"—"}</span>
        <span style="width:36px">${esc(s.c)}</span>
        <span style="width:44px;color:var(--faint);font-size:11.5px">${s.lie?LIES.find(l=>l.key===s.lie).label:""}</span>
        <span style="flex:1;color:${!s.r?"#8A6D1A":s.r==="target"?"var(--green)":s.r==="penalty"?"var(--flag)":"#6B5B2A"}" onclick="openFill('${r.id}','${s.id}')">${s.r?RL[s.r]:"… tap to fill"}</span>
        <span style="width:52px;text-align:right;font-size:11px;color:var(--faint)">${carry!=null?"→"+carry+"y":""}</span>
        <button onclick="deleteShot('${r.id}','${s.id}')" style="background:none;border:none;color:#B8B5A4;font-size:16px;padding:2px 4px">×</button>
      </div>`;}).join("")}
    </div>`).join("")}
  ${r.shots.length===0?'<div style="padding:24px;font-size:13px;color:var(--faint)">No shots logged yet this round.</div>':""}
  <div style="padding:14px 16px"><button class="ghost g" onclick="exportCSV()">Export all data to CSV ↓</button></div>`;
}

// ---------- STATS ----------
function rStats(){
  let rounds=ui.statCourse==="all"?S.rounds:S.rounds.filter(r=>r.courseId===ui.statCourse);
  if(ui.statScope==="last5")rounds=[...rounds].sort((a,b)=>b.ts-a.ts).slice(0,5);
  const shots=rounds.flatMap(r=>r.shots.map(s=>({s,r}))).filter(x=>x.s.r); // completed shots only
  if(!shots.length)return `<div style="padding:32px;font-size:14px;color:var(--faint)">Stats appear once you've logged shots.</div>`;

  const onT=shots.filter(x=>x.s.r==="target").length;
  const pens=shots.filter(x=>x.s.r==="penalty").length;
  const pct=Math.round(onT/shots.length*100);

  // trend (per round chronological)
  const trend=[...rounds].sort((a,b)=>a.ts-b.ts).map(r=>{
    const cs=r.shots.filter(s=>s.r);const n=cs.length,t=cs.filter(s=>s.r==="target").length;
    return {date:fmtDate(r.date).replace(/, \d{4}/,""),name:(r.courseName.match(/East/)?"East":r.courseName.match(/West/)?"West":"—"),pct:n?Math.round(t/n*100):0};
  });

  // clubs
  const byClub={};shots.forEach(x=>{(byClub[x.s.c]=byClub[x.s.c]||[]).push(x);});
  const clubRows=S.clubs.filter(cl=>byClub[cl]).map(cl=>{
    const ss=byClub[cl];const wd=ss.filter(x=>x.s.d);
    const t=ss.filter(x=>x.s.r==="target");const td=t.filter(x=>x.s.d);
    const carries=ss.map(x=>shotCarry(x.r,x.s)).filter(v=>v!=null);
    const goodCarries=t.map(x=>shotCarry(x.r,x.s)).filter(v=>v!=null);
    const avg=wd.length?Math.round(wd.reduce((a,x)=>a+x.s.d,0)/wd.length):null;
    const pure=td.length?Math.round(td.reduce((a,x)=>a+x.s.d,0)/td.length):null;
    const dist=goodCarries.length?Math.round(goodCarries.reduce((a,b)=>a+b,0)/goodCarries.length)
              :(carries.length?Math.round(carries.reduce((a,b)=>a+b,0)/carries.length):null);
    const nD=goodCarries.length||carries.length;
    const miss={};ss.forEach(x=>{if(x.s.r!=="target")miss[x.s.r]=(miss[x.s.r]||0)+1;});
    const top=Object.entries(miss).sort((a,b)=>b[1]-a[1])[0];
    return {cl,n:ss.length,avg,pure,dist,nD,pct:Math.round(t.length/ss.length*100),top};
  });

  // lies
  const lieRows=LIES.map(l=>{
    const ss=shots.filter(x=>x.s.lie===l.key);if(!ss.length)return null;
    const t=ss.filter(x=>x.s.r==="target").length,p=ss.filter(x=>x.s.r==="penalty").length;
    const miss={};ss.forEach(x=>{if(x.s.r!=="target")miss[x.s.r]=(miss[x.s.r]||0)+1;});
    const top=Object.entries(miss).sort((a,b)=>b[1]-a[1])[0];
    return {label:LL[l.key],n:ss.length,pct:Math.round(t/ss.length*100),pen:p,top};
  }).filter(Boolean);

  // driver slice watch
  const dr=shots.filter(x=>x.s.c==="Dr");
  const drDist={};dr.forEach(x=>{drDist[x.s.r]=(drDist[x.s.r]||0)+1;});

  // SG-lite
  const sgCats={};let sgTotal=0,sgN=0;
  shots.forEach(x=>{
    const v=shotSG(x.r,x.s);
    if(v==null)return;
    const cat=sgCategory(x.s,x.r);
    sgCats[cat]=(sgCats[cat]||{sum:0,n:0});sgCats[cat].sum+=v;sgCats[cat].n++;
    sgTotal+=v;sgN++;
  });
  // putting (needs putts entered)
  let puttSum=0,puttN=0;
  rounds.forEach(r=>{Object.entries(r.putts||{}).forEach(([h,n])=>{
    if(n==null)return;
    puttSum+=(1.93-n); // vs ~25 ft expectation baseline
    puttN++;
  });});
  const roundsCount=rounds.length||1;

  const SGROW=(name,sum,n,per)=>`<div class="tr"><span style="flex:1;font-weight:700">${name}</span>
    <span style="width:44px;text-align:right;color:var(--faint)">${n}</span>
    <span style="width:88px;text-align:right;font-weight:700;color:${per>=0?"var(--green)":"var(--flag)"}">${per>=0?"+":""}${per.toFixed(2)}</span></div>`;

  return `
  <div class="sechead"><span class="t">CLUB BOOK</span>
    <span style="display:flex;gap:6px">
      <button class="pill ${ui.statScope==="all"?"on":""}" onclick="setScope('all')">All</button>
      <button class="pill ${ui.statScope==="last5"?"on":""}" onclick="setScope('last5')">Last 5</button>
    </span></div>
  <div style="display:flex;gap:6px;padding:0 16px 4px;flex-wrap:wrap">
    ${[{id:"all",name:"All courses"},...S.courses].map(c=>`<button class="pill g ${ui.statCourse===c.id?"on g":""}" onclick="setStatCourse('${c.id}')">${esc(c.name.replace("Sunningdale ","").replace(/ \(.*\)/,""))}</button>`).join("")}
  </div>

  <div style="display:flex;border-bottom:2px solid var(--ink);border-top:1px solid var(--line);margin-top:8px">
    ${[[rounds.length,"ROUNDS"],[shots.length,"SHOTS"],[pct+"%","ON TARGET"],[pens,"PENALTIES"]].map(x=>`
    <div style="flex:1;padding:12px 0 9px;text-align:center;border-right:1px solid var(--line)">
      <div style="font-weight:700;font-size:24px">${x[0]}</div>
      <div style="font-family:var(--cond);font-size:11.5px;letter-spacing:.16em;color:var(--faint);font-weight:600">${x[1]}</div></div>`).join("")}
  </div>

  ${trend.length>1?`<div class="gfxwrap">
    <div class="gtitle"><span>EXECUTION TREND</span><span style="letter-spacing:0">on-target % by round</span></div>
    ${trendSVG(trend,Math.min(480,(window.innerWidth||390)-48))}
  </div>`:""}

  ${dr.length?`<div class="gfxwrap">
    <div class="gtitle"><span>DRIVER · MISS PATTERN</span><span style="letter-spacing:0">${dr.length} tee balls</span></div>
    ${roseSVG(drDist,Math.min(480,(window.innerWidth||390)-48))}
    <div style="font-size:10.5px;color:var(--tx2);text-align:center;padding-top:4px">
      centre = on target · petal length = frequency</div>
  </div>`:""}

  ${(()=>{ // scoring stats from rounds with scores entered
    const rs=rounds.map(r=>roundScoring(r)).filter(x=>x&&x.holes>0);
    if(!rs.length)return "";
    const sum=k=>rs.reduce((a,x)=>a+x[k],0);
    const holes=sum("holes"), vsPar=sum("tot")-sum("par");
    const fw=sum("fwOpp")?Math.round(sum("fwHit")/sum("fwOpp")*100):null;
    const gir=sum("girOpp")?Math.round(sum("gir")/sum("girOpp")*100):null;
    const scr=sum("scrOpp")?Math.round(sum("scr")/sum("scrOpp")*100):null;
    const sav=sum("ssOpp")?Math.round(sum("ss")/sum("ssOpp")*100):null;
    const per18=holes?((vsPar/holes)*18):null;
    return `<div class="gfxwrap">
      <div class="gtitle"><span>SCORING</span><span style="letter-spacing:0">${holes} holes · ${per18!=null?`<b style="color:${per18>0?"var(--rose)":"var(--lime)"}">${per18>0?"+":""}${per18.toFixed(1)}</b> vs par/18`:""}</span></div>
      <div style="display:flex;justify-content:space-around;flex-wrap:wrap;gap:4px">
        ${gaugeSVG(fw,"FAIRWAY","#8FE3AF",84)}
        ${gaugeSVG(gir,"GIR","#3FBF7A",84)}
        ${gaugeSVG(scr,"SCRAMBLE","#F5C451",84)}
        ${gaugeSVG(sav,"SAND","#E9A23B",84)}
      </div></div>
    <div class="note">All derived — no extra taps: fairways from tee-shot results, GIR from score−putts vs par−2, scrambling = par-or-better on missed greens, sand saves = par-or-better on holes with a greenside sand shot.</div>`;})()}

  ${clubRows.filter(r=>r.dist).length>1?`<div class="gfxwrap">
    <div class="gtitle"><span>GAPPING</span><span style="letter-spacing:0">measured distance · well-struck only</span></div>
    ${gapSVG(clubRows,Math.min(480,(window.innerWidth||390)-48))}
  </div>`:""}

  <div class="sechead"><span class="t">CLUB BOOK</span><span class="n">DIST = how far it goes · TO PIN = what you faced</span></div>
  <div class="th"><span style="width:38px">CLUB</span><span style="width:26px;text-align:right">N</span>
    <span style="width:52px;text-align:right">DIST</span><span style="width:32px;text-align:right">n</span>
    <span style="width:50px;text-align:right">TO PIN</span><span style="width:46px;text-align:right">ON-T%</span>
    <span style="flex:1;text-align:right">TOP MISS</span></div>
  ${clubRows.map(r=>`<div class="tr">
    <span style="width:38px;font-weight:700">${esc(r.cl)}</span>
    <span style="width:26px;text-align:right;color:var(--faint)">${r.n}</span>
    <span style="width:52px;text-align:right;font-weight:700;font-size:15px;color:#8FE3AF">${r.dist??"—"}</span>
    <span style="width:32px;text-align:right;font-size:10px;color:var(--tx2)">${r.nD||"—"}</span>
    <span style="width:50px;text-align:right;color:var(--sage)">${r.pure??"—"}</span>
    <span style="width:46px;text-align:right" class="${r.pct>=50?"gd":r.pct>=35?"md":"bd"}">${r.pct}%</span>
    <span style="flex:1;text-align:right;font-size:10.5px;color:var(--faint)">${r.top?RL[r.top[0]]+" ×"+r.top[1]:"—"}</span></div>`).join("")}

  <div class="sechead"><span class="t">BY LIE</span></div>
  <div class="th"><span style="flex:1">LIE</span><span style="width:36px;text-align:right">N</span>
    <span style="width:54px;text-align:right">ON-T%</span><span style="width:40px;text-align:right">PEN</span>
    <span style="width:100px;text-align:right">TOP MISS</span></div>
  ${lieRows.map(l=>`<div class="tr">
    <span style="flex:1;font-weight:700">${l.label}</span>
    <span style="width:36px;text-align:right;color:var(--faint)">${l.n}</span>
    <span style="width:54px;text-align:right" class="${l.pct>=45?"gd":l.pct>=30?"md":"bd"}">${l.pct}%</span>
    <span style="width:40px;text-align:right" class="${l.pen?"bd":""}" ${!l.pen?'style="color:var(--faint)"':""}>${l.pen||"—"}</span>
    <span style="width:100px;text-align:right;font-size:10.5px;color:var(--faint)">${l.top?RL[l.top[0]]+" ×"+l.top[1]:"—"}</span></div>`).join("")}

  <div class="note">DIST = measured shot distance (position to position) on well-struck shots — the number to club off, equivalent to an Arccos smart distance. TO PIN = the yardage you were facing. Both need shots placed on the map or GPS-pinned; typed yardages fill TO PIN only.</div>

  ${sgN?`<div class="sechead"><span class="t">STROKES GAINED — LITE</span><span class="n">per round vs scratch model</span></div>
  <div class="th"><span style="flex:1">CATEGORY</span><span style="width:44px;text-align:right">SHOTS</span><span style="width:88px;text-align:right">SG / ROUND</span></div>
  ${Object.entries(sgCats).map(([k,v])=>SGROW(k,v.sum,v.n,v.sum/roundsCount)).join("")}
  ${puttN?SGROW("Putting*",puttSum,puttN,puttSum/roundsCount):""}
  <div class="note">Modelled end-states on hole-out shots; needs distance + lie on every shot to count. Negative numbers show where the strokes are leaking — expect everything negative vs the scratch baseline; the *relative* sizes are the insight.${puttN?" *Putting assumes ~25 ft first putts.":""}</div>`:""}

  <div class="sechead"><span class="t">ROUNDS</span></div>
  ${[...S.rounds].sort((a,b)=>b.ts-a.ts).map(r=>{
    const t=r.shots.filter(s=>s.r==="target").length;
    return `<div class="tr" style="justify-content:space-between">
      <span style="font-size:12.5px">${esc(r.courseName.replace("Sunningdale ","S'dale ").replace(/ \(.*\)/,""))} · ${fmtDate(r.date)||"—"}${r.id===S.activeId?" ● live":""}</span>
      <span style="font-size:12px;color:var(--faint)">${r.shots.length} shots · ${r.shots.length?Math.round(t/r.shots.length*100):0}% on-T</span></div>`;}).join("")}
  <div style="padding:14px 16px 24px"><button class="ghost g" onclick="exportCSV()">Export all data to CSV ↓</button></div>`;
}

// ---------- COURSES ----------
function rCourses(){
  return `<div class="sechead"><span class="t">COURSES</span></div>
  <div class="note" style="padding-top:0">Pars are locked to the official scorecards. Tap any hole to place its green on the satellite map — <span style="color:#F5C451">gold ⛳</span> = placed from map, <span style="color:#3FBF7A">green ⛳</span> = confirmed by GPS on the course. Map tags work immediately; walking the green later overwrites with a GPS fix. Satellite imagery can predate course changes — any recently built or relocated green won't appear, so tag those with GPS on the course.</div>
  ${S.courses.map(c=>`<div class="card">
    <div style="padding:10px 12px;background:#F1EFE4;display:flex;justify-content:space-between;align-items:center">
      ${ui.renaming===c.id
        ?`<input id="rn-${c.id}" onblur="saveRename('${c.id}')" onkeydown="if(event.key==='Enter')saveRename('${c.id}')"
            style="font-family:var(--cond);font-size:18px;font-weight:700;border:1px solid var(--line);border-radius:5px;padding:3px 8px;flex:1;margin-right:8px">`
        :`<span style="font-family:var(--cond);font-size:19px;font-weight:700">${esc(c.name)}</span>`}
      <span style="display:flex;gap:10px;align-items:center">
        <span style="font-size:12px;color:var(--tx2)">Par ${c.pars.reduce((a,b)=>a+b,0)} · ⛳${Object.keys(c.greens).filter(h=>greenPts(c,h)).length}/18</span>
        <button class="ghost g" style="font-size:11px" onclick="startRename('${c.id}')">rename</button>
      </span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(9,1fr)">
      ${c.pars.map((p,i)=>{const g=greenPts(c,i+1);
        const src=g?(["front","center","back"].some(k=>g[k]&&(g.src&&g.src[k])==="gps")?"gps":"map"):null;
        return `<button class="parbtn" onclick="openGreenMap('${c.id}',${i+1})">
        <small>${i+1}${src==="gps"?' <span style="color:#3FBF7A">⛳</span>':src==="map"?' <span style="color:#F5C451">⛳</span>':""}</small><b>${p}</b></button>`;}).join("")}
    </div>
    <button onclick="openGreenMap('${c.id}',1)" style="width:100%;padding:12px 0;border:none;
      border-top:1px solid rgba(255,255,255,.10);background:rgba(143,227,175,.10);color:#8FE3AF;
      font-family:var(--cond);font-size:16px;font-weight:700;letter-spacing:.1em">🛰 SET UP GREENS ON SATELLITE MAP</button>
  </div>`).join("")}
  <div style="padding:16px"><button class="ghost g" onclick="exportCSV()">Export all data to CSV ↓</button></div>`;
}

// ---------- boot ----------
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
render();
if(S.autoPin&&active())startAuto();
</script>
</body>
</html>
